<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ArUco 台車判別</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}header{padding:12px;text-align:center;font-size:18px;font-weight:700}.viewer{position:relative;flex:1;min-height:66dvh;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000a;padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap}.panel{padding:12px 16px calc(16px + env(safe-area-inset-bottom));text-align:center}#result{font-size:clamp(56px,18vw,96px);font-weight:800;line-height:1;min-height:1.05em}#status{margin-top:8px;color:#bbb;font-size:14px;min-height:1.4em}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#fff;color:#111;font-size:17px;font-weight:700}canvas{display:none}
</style>
</head>
<body>
<header>ArUco 台車判別</header>
<div class="viewer"><video id="video" autoplay playsinline muted></video><div class="hint">画面内にマーカーが入ればOK</div></div>
<div class="panel"><div id="result">---</div><div id="status">検出ライブラリを読み込み中…</div><button id="btn" type="button" disabled>カメラを起動</button></div>
<canvas id="work"></canvas>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/dictionaries/aruco_4x4_1000.js"></script>
<script>
const CART={1:'A01',2:'A02',3:'A03',4:'A04',5:'A05',6:'A06',7:'A07',8:'A08',9:'A09',10:'A10',11:'B01',12:'B02',13:'B03',14:'B04',15:'B05',16:'B06',17:'B07',18:'B08',19:'B09',20:'B10'};
const video=document.getElementById('video'),canvas=document.getElementById('work'),ctx=canvas.getContext('2d',{willReadFrequently:true}),res=document.getElementById('result'),stat=document.getElementById('status'),btn=document.getElementById('btn');
let detector=null,stream=null,running=false,timer=null,busy=false,lastId=null,hits=0,lastSeen=0;
function ready(){try{if(!window.AR||!window.CV||!AR.DICTIONARIES['ARUCO_4X4_1000'])throw new Error('ライブラリ未読込');detector=new AR.Detector({dictionaryName:'ARUCO_4X4_1000',maxHammingDistance:1});btn.disabled=false;stat.textContent='準備完了';}catch(e){stat.textContent='検出ライブラリエラー: '+e.message;}}
window.addEventListener('load',ready);
function setCanvasSize(){const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return;const maxLong=1280;const scale=Math.min(1,maxLong/Math.max(vw,vh));canvas.width=Math.max(1,Math.round(vw*scale));canvas.height=Math.max(1,Math.round(vh*scale));}
function polygonArea(c){let s=0;for(let i=0;i<c.length;i++){const a=c[i],b=c[(i+1)%c.length];s+=a.x*b.y-b.x*a.y;}return Math.abs(s)/2;}
function scan(){if(!running||busy||video.readyState<2||!detector)return;busy=true;try{if(!canvas.width||!canvas.height)setCanvasSize();ctx.drawImage(video,0,0,canvas.width,canvas.height);const data=ctx.getImageData(0,0,canvas.width,canvas.height);let markers=detector.detect(data).filter(m=>Number.isInteger(m.id)&&m.id>=1&&m.id<=20);if(markers.length){markers.sort((a,b)=>polygonArea(b.corners)-polygonArea(a.corners));const m=markers[0];lastSeen=Date.now();if(m.id===lastId)hits++;else{lastId=m.id;hits=1;}stat.textContent='候補 ID:'+m.id+'  '+hits+'/2';if(hits>=2){res.textContent=CART[m.id];stat.textContent='ID: '+m.id+' 検出';}}else if(Date.now()-lastSeen>600){lastId=null;hits=0;res.textContent='---';stat.textContent='マーカーを探しています…';}}catch(e){stat.textContent='検出エラー: '+e.message;}finally{busy=false;}}
async function start(){btn.disabled=true;stat.textContent='カメラ許可を確認中…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('SafariのカメラAPIを利用できません');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}});video.srcObject=stream;await video.play();setCanvasSize();running=true;btn.disabled=false;btn.textContent='カメラ停止';stat.textContent='マーカーを探しています…';timer=setInterval(scan,200);}catch(e){btn.disabled=false;btn.textContent='カメラを起動';stat.textContent='カメラエラー: '+(e.name||'')+' '+(e.message||e);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}}
function stop(){running=false;if(timer){clearInterval(timer);timer=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;lastId=null;hits=0;lastSeen=0;res.textContent='---';stat.textContent='停止中';btn.textContent='カメラを起動';}
btn.addEventListener('click',()=>running?stop():start());window.addEventListener('pagehide',stop);
</script>
</body>
</html>
