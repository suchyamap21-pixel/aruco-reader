<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>ArUco 台車判別</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}header{padding:12px;text-align:center;font-size:18px;font-weight:700}.viewer{position:relative;flex:1;min-height:64dvh;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;left:8%;right:8%;top:12%;bottom:12%;border:2px solid #ffffff88;border-radius:18px;pointer-events:none}.guide:after{content:'この範囲にマーカーを映す';position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;font-size:13px;background:#000a;padding:5px 9px;border-radius:7px}.panel{padding:12px 16px calc(16px + env(safe-area-inset-bottom));text-align:center}#result{font-size:clamp(54px,17vw,92px);font-weight:800;min-height:1.1em;line-height:1}#status{margin-top:8px;color:#bbb;font-size:14px;min-height:1.4em}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#fff;color:#111;font-size:17px;font-weight:700}canvas{display:none}</style></head><body><header>ArUco 台車判別</header><div class="viewer"><video id="video" autoplay playsinline muted></video><div class="guide"></div></div><div class="panel"><div id="result">---</div><div id="status">カメラを起動してください</div><button id="btn" type="button">カメラを起動</button></div><canvas id="work" width="360" height="270"></canvas><script>
const T={1:['000000','000000','011110','010010','010100','000000'],2:['000000','000110','000110','000100','011010','000000'],3:['000000','010010','010010','001000','001100','000000'],4:['000000','001010','001000','010010','011100','000000'],5:['000000','001110','010010','011000','011010','000000'],6:['000000','010010','011100','000100','011100','000000'],7:['000000','011000','001000','011110','000100','000000'],8:['000000','011110','011100','011010','010100','000000'],9:['000000','011000','011110','001010','001100','000000'],10:['000000','011110','010010','010010','000010','000000'],11:['000000','000010','000010','010100','001110','000000'],12:['000000','000000','011100','010110','001110','000000'],13:['000000','000100','010100','000000','011110','000000'],14:['000000','000100','001000','010110','000010','000000'],15:['000000','000100','001100','000110','011100','000000'],16:['000000','001000','001100','001100','001010','000000'],17:['000000','001100','001100','000000','000000','000000'],18:['000000','001100','011000','001010','011100','000000'],19:['000000','001110','001100','010100','011110','000000'],20:['000000','010000','001100','010000','010110','000000']};for(const k in T)T[k]=T[k].map(r=>[...r].map(Number));const CART={1:'A01',2:'A02',3:'A03',4:'A04',5:'A05',6:'A06',7:'A07',8:'A08',9:'A09',10:'A10',11:'B01',12:'B02',13:'B03',14:'B04',15:'B05',16:'B06',17:'B07',18:'B08',19:'B09',20:'B10'};const video=document.getElementById('video'),canvas=document.getElementById('work'),ctx=canvas.getContext('2d',{willReadFrequently:true}),res=document.getElementById('result'),stat=document.getElementById('status'),btn=document.getElementById('btn');let stream=null,running=false,timer=null,last=null,hits=0;function rot(m){let o=Array.from({length:6},()=>Array(6));for(let r=0;r<6;r++)for(let c=0;c<6;c++)o[c][5-r]=m[r][c];return o}function ham(a,b){let d=0;for(let r=0;r<6;r++)for(let c=0;c<6;c++)d+=a[r][c]!==b[r][c];return d}function dec(b){let best={id:0,d:99},q=b;for(let z=0;z<4;z++){for(const[id,t]of Object.entries(T)){const d=ham(q,t);if(d<best.d)best={id:+id,d}}q=rot(q)}return best}function miss(msg='マーカーを探しています…'){last=null;hits=0;res.textContent='---';stat.textContent=msg}function scan(){if(!running||video.readyState<2)return;ctx.drawImage(video,0,0,360,270);const im=ctx.getImageData(0,0,360,270).data;let best=null;for(let s=72;s<=216;s+=24){const step=Math.max(12,s/8);for(let y=12;y+s<258;y+=step)for(let x=12;x+s<348;x+=step){const vals=[];let mn=255,mx=0;const cell=s/6;for(let r=0;r<6;r++){const row=[];for(let c=0;c<6;c++){const cx=(x+(c+.5)*cell)|0,cy=(y+(r+.5)*cell)|0,i=(cy*360+cx)*4,v=.299*im[i]+.587*im[i+1]+.114*im[i+2];row.push(v);mn=Math.min(mn,v);mx=Math.max(mx,v)}vals.push(row)}if(mx-mn<65)continue;const th=(mn+mx)/2,b=vals.map(row=>row.map(v=>v>th?1:0));let bw=0;for(let r=0;r<6;r++)for(let c=0;c<6;c++)if((r===0||r===5||c===0||c===5)&&b[r][c])bw++;if(bw>2)continue;const d=dec(b);if(d.d<=2&&(!best||d.d<best.d))best={id:d.id,d:d.d}}}if(!best){miss();return}if(best.id===last)hits++;else{last=best.id;hits=1}stat.textContent='候補 ID:'+best.id+' '+hits+'/2';if(hits>=2){res.textContent=CART[best.id]||('ID '+best.id);stat.textContent='ID: '+best.id+' 検出'}}async function start(){stat.textContent='カメラ許可を確認中…';btn.disabled=true;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('SafariのカメラAPIを利用できません');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'environment'}});video.srcObject=stream;await video.play();running=true;btn.disabled=false;btn.textContent='カメラ停止';stat.textContent='画面内にマーカーを映してください';timer=setInterval(scan,250)}catch(e){btn.disabled=false;btn.textContent='カメラを起動';stat.textContent='カメラエラー: '+(e.name||'')+' '+(e.message||e);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}}function stop(){running=false;if(timer){clearInterval(timer);timer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;btn.disabled=false;btn.textContent='カメラを起動';miss('停止中')}btn.addEventListener('click',function(){if(running)stop();else start()});window.addEventListener('pagehide',stop);</script></body></html>
