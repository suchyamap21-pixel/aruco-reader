<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>ArUco 台車判別</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}header{padding:12px;text-align:center;font-size:18px;font-weight:700}.viewer{position:relative;flex:1;min-height:64dvh;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;left:8%;right:8%;top:12%;bottom:12%;border:2px solid #ffffff88;border-radius:18px;pointer-events:none}.guide:after{content:'この範囲にマーカーを映す';position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;font-size:13px;background:#000a;padding:5px 9px;border-radius:7px}.candidate{position:absolute;border:4px solid #55ff88;border-radius:8px;display:none;pointer-events:none}.panel{padding:12px 16px calc(16px + env(safe-area-inset-bottom));text-align:center}#result{font-size:clamp(54px,17vw,92px);font-weight:800;min-height:1.1em;line-height:1}#status{margin-top:8px;color:#bbb;font-size:14px;min-height:1.4em}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#fff;color:#111;font-size:17px;font-weight:700}canvas{display:none}</style></head><body><header>ArUco 台車判別</header><div class="viewer" id="viewer"><video id="video" playsinline muted></video><div class="guide"></div><div class="candidate" id="candidate"></div></div><div class="panel"><div id="result">---</div><div id="status">カメラを起動してください</div><button id="btn">カメラを起動</button></div><canvas id="work" width="320" height="240"></canvas><script>
const T={1:['000000','000000','011110','010010','010100','000000'],2:['000000','000110','000110','000100','011010','000000'],3:['000000','010010','010010','001000','001100','000000'],4:['000000','001010','001000','010010','011100','000000'],5:['000000','001110','010010','011000','011010','000000'],6:['000000','010010','011100','000100','011100','000000'],7:['000000','011000','001000','011110','000100','000000'],8:['000000','011110','011100','011010','010100','000000'],9:['000000','011000','011110','001010','001100','000000'],10:['000000','011110','010010','010010','000010','000000'],11:['000000','000010','000010','010100','001110','000000'],12:['000000','000000','011100','010110','001110','000000'],13:['000000','000100','010100','000000','011110','000000'],14:['000000','000100','001000','010110','000010','000000'],15:['000000','000100','001100','000110','011100','000000'],16:['000000','001000','001100','001100','001010','000000'],17:['000000','001100','001100','000000','000000','000000'],18:['000000','001100','011000','001010','011100','000000'],19:['000000','001110','001100','010100','011110','000000'],20:['000000','010000','001100','010000','010110','000000']};
const CART={1:'A01',2:'A02',3:'A03',4:'A04',5:'A05',6:'A06',7:'A07',8:'A08',9:'A09',10:'A10',11:'B01',12:'B02',13:'B03',14:'B04',15:'B05',16:'B06',17:'B07',18:'B08',19:'B09',20:'B10'};for(const k in T)T[k]=T[k].map(r=>[...r].map(Number));const video=document.querySelector('#video'),viewer=document.querySelector('#viewer'),canvas=document.querySelector('#work'),ctx=canvas.getContext('2d',{willReadFrequently:true}),res=document.querySelector('#result'),stat=document.querySelector('#status'),btn=document.querySelector('#btn'),box=document.querySelector('#candidate');let stream,running=false,timer,last=null,hits=0;
function rot(m){let o=Array.from({length:6},()=>Array(6));for(let r=0;r<6;r++)for(let c=0;c<6;c++)o[c][5-r]=m[r][c];return o}function ham(a,b){let d=0;for(let r=0;r<6;r++)for(let c=0;c<6;c++)d+=a[r][c]!=b[r][c];return d}function dec(b){let best={id:0,d:99},q=b;for(let z=0;z<4;z++){for(const[id,t]of Object.entries(T)){let d=ham(q,t);if(d<best.d)best={id:+id,d}}q=rot(q)}return best}
function miss(msg='マーカーを探しています…'){last=null;hits=0;res.textContent='---';stat.textContent=msg;box.style.display='none'}
function showBox(x,y,s){const vr=viewer.getBoundingClientRect(),sx=vr.width/320,sy=vr.height/240;box.style.left=(x*sx)+'px';box.style.top=(y*sy)+'px';box.style.width=(s*sx)+'px';box.style.height=(s*sy)+'px';box.style.display='block'}
function scan(){if(!running||!video.videoWidth)return;ctx.drawImage(video,0,0,320,240);const p=ctx.getImageData(0,0,320,240).data,w=320,h=240,ii=new Float32Array((w+1)*(h+1));for(let y=1;y<=h;y++){let row=0;for(let x=1;x<=w;x++){let i=((y-1)*w+(x-1))*4;row+=.299*p[i]+.587*p[i+1]+.114*p[i+2];ii[y*(w+1)+x]=ii[(y-1)*(w+1)+x]+row}}function mean(x0,y0,x1,y1){x0=Math.max(0,x0|0);y0=Math.max(0,y0|0);x1=Math.min(w,x1|0);y1=Math.min(h,y1|0);let A=ii[y0*(w+1)+x0],B=ii[y0*(w+1)+x1],C=ii[y1*(w+1)+x0],D=ii[y1*(w+1)+x1];return(D-B-C+A)/Math.max(1,(x1-x0)*(y1-y0))}
let best=null;for(let s=54;s<=186;s+=12){let step=Math.max(6,Math.round(s/14));for(let y=8;y+s<h-8;y+=step)for(let x=8;x+s<w-8;x+=step){let vals=Array.from({length:6},()=>Array(6)),mn=255,mx=0,cell=s/6;for(let r=0;r<6;r++)for(let c=0;c<6;c++){let pad=cell*.22,v=mean(x+c*cell+pad,y+r*cell+pad,x+(c+1)*cell-pad,y+(r+1)*cell-pad);vals[r][c]=v;if(v<mn)mn=v;if(v>mx)mx=v}let contrast=mx-mn;if(contrast<48)continue;let th=(mn+mx)/2,bits=vals.map(row=>row.map(v=>v>th?1:0)),bw=0;for(let r=0;r<6;r++)for(let c=0;c<6;c++)if((r==0||r==5||c==0||c==5)&&bits[r][c])bw++;if(bw>3)continue;let d=dec(bits),score=d.d*30+bw*12-contrast*.15;if(d.d<=3&&(!best||score<best.score))best={id:d.id,d:d.d,x,y,s,score,contrast}}
if(!best){miss();return}showBox(best.x,best.y,best.s);if(best.id===last)hits++;else{last=best.id;hits=1}if(hits>=2){res.textContent=CART[best.id]||('ID '+best.id);stat.textContent='ID: '+best.id+'　検出'}else stat.textContent='候補検出中…'}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();running=true;btn.textContent='カメラ停止';stat.textContent='画面内にマーカーを映してください';timer=setInterval(scan,220)}catch(e){stat.textContent='カメラを起動できません: '+e.message}}function stop(){running=false;clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;btn.textContent='カメラを起動';miss('停止中')}btn.onclick=()=>running?stop():start();window.addEventListener('pagehide',stop);if(!navigator.mediaDevices?.getUserMedia){stat.textContent='HTTPS環境で開いてください';btn.disabled=true}</script></body></html>
