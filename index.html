<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>ArUco 台車判別</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}header{padding:12px;text-align:center;font-size:18px;font-weight:700}.viewer{position:relative;flex:1;min-height:60dvh;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(72vw,320px);aspect-ratio:1;border:4px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px #0004;pointer-events:none}.guide:after{content:'マーカー外周を枠に合わせる';position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:max-content;font-size:13px;background:#000a;padding:5px 9px;border-radius:7px}.panel{padding:12px 16px calc(16px + env(safe-area-inset-bottom));text-align:center}#result{font-size:clamp(54px,17vw,92px);font-weight:800;min-height:1.1em}#status{margin-top:8px;color:#bbb;font-size:14px;min-height:1.4em}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#fff;color:#111;font-size:17px;font-weight:700}canvas{display:none}</style></head><body><header>ArUco 台車判別</header><div class="viewer" id="viewer"><video id="video" playsinline muted></video><div class="guide" id="guide"></div></div><div class="panel"><div id="result">---</div><div id="status">カメラを起動してください</div><button id="btn">カメラを起動</button></div><canvas id="work" width="300" height="300"></canvas><script>
const T={1:['000000','000000','011110','010010','010100','000000'],2:['000000','000110','000110','000100','011010','000000'],3:['000000','010010','010010','001000','001100','000000'],4:['000000','001010','001000','010010','011100','000000'],5:['000000','001110','010010','011000','011010','000000'],6:['000000','010010','011100','000100','011100','000000'],7:['000000','011000','001000','011110','000100','000000'],8:['000000','011110','011100','011010','010100','000000'],9:['000000','011000','011110','001010','001100','000000'],10:['000000','011110','010010','010010','000010','000000'],11:['000000','000010','000010','010100','001110','000000'],12:['000000','000000','011100','010110','001110','000000'],13:['000000','000100','010100','000000','011110','000000'],14:['000000','000100','001000','010110','000010','000000'],15:['000000','000100','001100','000110','011100','000000'],16:['000000','001000','001100','001100','001010','000000'],17:['000000','001100','001100','000000','000000','000000'],18:['000000','001100','011000','001010','011100','000000'],19:['000000','001110','001100','010100','011110','000000'],20:['000000','010000','001100','010000','010110','000000']};
const CART={1:'A01',2:'A02',3:'A03',4:'A04',5:'A05',6:'A06',7:'A07',8:'A08',9:'A09',10:'A10',11:'B01',12:'B02',13:'B03',14:'B04',15:'B05',16:'B06',17:'B07',18:'B08',19:'B09',20:'B10'};for(const k in T)T[k]=T[k].map(r=>[...r].map(Number));const video=document.querySelector('#video'),viewer=document.querySelector('#viewer'),guide=document.querySelector('#guide'),canvas=document.querySelector('#work'),ctx=canvas.getContext('2d',{willReadFrequently:true}),res=document.querySelector('#result'),stat=document.querySelector('#status'),btn=document.querySelector('#btn');let stream,running=false,timer,last=null,hits=0;function rot(m){let o=Array.from({length:6},()=>Array(6));for(let r=0;r<6;r++)for(let c=0;c<6;c++)o[c][5-r]=m[r][c];return o}function ham(a,b){let d=0;for(let r=0;r<6;r++)for(let c=0;c<6;c++)d+=a[r][c]!=b[r][c];return d}function dec(b){let best={id:0,d:99},q=b;for(let z=0;z<4;z++){for(const[id,t]of Object.entries(T)){let d=ham(q,t);if(d<best.d)best={id:+id,d}}q=rot(q)}return best.d<=2?best:null}function miss(){last=null;hits=0;res.textContent='---'}function scan(){if(!running||!video.videoWidth)return;let vr=viewer.getBoundingClientRect(),gr=guide.getBoundingClientRect(),vw=video.videoWidth,vh=video.videoHeight,sc=Math.max(vr.width/vw,vr.height/vh),ox=(vr.width-vw*sc)/2,oy=(vr.height-vh*sc)/2,sx=(gr.left-vr.left-ox)/sc,sy=(gr.top-vr.top-oy)/sc,sw=gr.width/sc,sh=gr.height/sc;ctx.drawImage(video,sx,sy,sw,sh,0,0,300,300);let im=ctx.getImageData(0,0,300,300).data,v=[];for(let r=0;r<6;r++){let row=[];for(let c=0;c<6;c++){let sum=0,n=0;for(let y=(r+.32)*50;y<(r+.68)*50;y+=3)for(let x=(c+.32)*50;x<(c+.68)*50;x+=3){let i=((y|0)*300+(x|0))*4;sum+=.299*im[i]+.587*im[i+1]+.114*im[i+2];n++}row.push(sum/n)}v.push(row)}let f=v.flat(),mn=Math.min(...f),mx=Math.max(...f);if(mx-mn<55){miss();stat.textContent='白黒の差が不足しています';return}let th=(mn+mx)/2,b=v.map(r=>r.map(x=>x>th?1:0)),bw=0;for(let r=0;r<6;r++)for(let c=0;c<6;c++)if((r==0||r==5||c==0||c==5)&&b[r][c])bw++;if(bw>2){miss();stat.textContent='マーカー外周を枠に合わせてください';return}let x=dec(b);if(!x){miss();stat.textContent='マーカーを認識できません';return}if(x.id==last)hits++;else{last=x.id;hits=1}if(hits>=3){res.textContent=CART[x.id];stat.textContent='ID: '+x.id}else stat.textContent='検出中… '+hits+'/3'}async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();running=true;btn.textContent='カメラ停止';stat.textContent='マーカー外周を枠に合わせてください';timer=setInterval(scan,120)}catch(e){stat.textContent='カメラを起動できません: '+e.message}}function stop(){running=false;clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());video.srcObject=null;btn.textContent='カメラを起動';stat.textContent='停止中';miss()}btn.onclick=()=>running?stop():start();if(!navigator.mediaDevices?.getUserMedia){stat.textContent='HTTPS環境で開いてください';btn.disabled=true}</script></body></html>
