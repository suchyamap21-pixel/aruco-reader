<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ArUco 台車判別</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column}
header{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:#111}
.viewer{position:relative;flex:1 1 auto;min-height:0;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#000b;padding:5px 9px;border-radius:7px;font-size:12px;white-space:nowrap}
.panel{flex:0 0 auto;padding:7px 12px calc(7px + env(safe-area-inset-bottom));text-align:center;background:#111}
#result{font-size:clamp(42px,13vw,68px);font-weight:800;line-height:.95;min-height:1em}
#status{margin-top:4px;color:#bbb;font-size:13px;line-height:1.2;min-height:16px}
button{width:100%;height:48px;margin-top:7px;padding:0;border:0;border-radius:12px;background:#fff;color:#111;font-size:17px;font-weight:700}
button:disabled{opacity:.55}
#work{display:none}
</style>
</head>
<body>
<header>ArUco 台車判別</header>
<div class="viewer" id="viewer">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="hint">画面内にマーカーが入ればOK</div>
</div>
<div class="panel">
  <div id="result">---</div>
  <div id="status">検出ライブラリを読み込み中…</div>
  <button id="btn" type="button" disabled>カメラを起動</button>
</div>
<canvas id="work"></canvas>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/dictionaries/aruco_4x4_1000.js"></script>
<script>
function displayId(id){return String(id).padStart(2,'0');}
const video=document.getElementById('video');
const viewer=document.getElementById('viewer');
const work=document.getElementById('work');
const ctx=work.getContext('2d',{willReadFrequently:true});
const overlay=document.getElementById('overlay');
const octx=overlay.getContext('2d');
const res=document.getElementById('result');
const stat=document.getElementById('status');
const btn=document.getElementById('btn');
let detector=null,stream=null,running=false,timer=null,busy=false,lastId=null,hits=0,lastSeen=0,lastCorners=null,lastLabel='';

function ready(){
  try{
    if(!window.AR||!window.CV||!AR.DICTIONARIES['ARUCO_4X4_1000']) throw new Error('ライブラリ未読込');
    detector=new AR.Detector({dictionaryName:'ARUCO_4X4_1000',maxHammingDistance:1});
    btn.disabled=false;
    stat.textContent='準備完了';
  }catch(e){stat.textContent='検出ライブラリエラー: '+e.message;}
}
window.addEventListener('load',ready);

function setWorkSize(){
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  const maxLong=1280;
  const scale=Math.min(1,maxLong/Math.max(vw,vh));
  work.width=Math.max(1,Math.round(vw*scale));
  work.height=Math.max(1,Math.round(vh*scale));
  resizeOverlay();
}

function resizeOverlay(){
  const r=viewer.getBoundingClientRect();
  const dpr=Math.max(1,window.devicePixelRatio||1);
  overlay.width=Math.max(1,Math.round(r.width*dpr));
  overlay.height=Math.max(1,Math.round(r.height*dpr));
  octx.setTransform(dpr,0,0,dpr,0,0);
  drawMarker(lastCorners,lastLabel);
}
window.addEventListener('resize',resizeOverlay);
window.visualViewport?.addEventListener('resize',resizeOverlay);

function polygonArea(c){
  let s=0;
  for(let i=0;i<c.length;i++){
    const a=c[i],b=c[(i+1)%c.length];
    s+=a.x*b.y-b.x*a.y;
  }
  return Math.abs(s)/2;
}

function drawMarker(corners,label){
  const r=viewer.getBoundingClientRect();
  octx.clearRect(0,0,r.width,r.height);
  if(!corners||!work.width||!work.height)return;

  const scale=Math.max(r.width/work.width,r.height/work.height);
  const shownW=work.width*scale;
  const shownH=work.height*scale;
  const ox=(r.width-shownW)/2;
  const oy=(r.height-shownH)/2;
  const pts=corners.map(p=>({x:ox+p.x*scale,y:oy+p.y*scale}));

  octx.beginPath();
  pts.forEach((p,i)=>{if(i===0)octx.moveTo(p.x,p.y);else octx.lineTo(p.x,p.y);});
  octx.closePath();
  octx.lineWidth=4;
  octx.strokeStyle='#ff2d2d';
  octx.lineJoin='round';
  octx.stroke();

  if(label){
    const minX=Math.min(...pts.map(p=>p.x));
    const maxX=Math.max(...pts.map(p=>p.x));
    const minY=Math.min(...pts.map(p=>p.y));
    const centerX=(minX+maxX)/2;
    const fontSize=Math.max(16,Math.min(28,(maxX-minX)*0.22));
    octx.font=`700 ${fontSize}px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif`;
    octx.textAlign='center';
    octx.textBaseline='middle';
    const textW=octx.measureText(label).width;
    const padX=10,padY=6;
    const boxW=textW+padX*2;
    const boxH=fontSize+padY*2;
    let boxX=centerX-boxW/2;
    let boxY=minY-boxH-8;
    if(boxY<6)boxY=minY+8;
    boxX=Math.max(6,Math.min(r.width-boxW-6,boxX));
    octx.fillStyle='rgba(255,45,45,.96)';
    octx.fillRect(boxX,boxY,boxW,boxH);
    octx.fillStyle='#fff';
    octx.fillText(label,boxX+boxW/2,boxY+boxH/2+1);
  }
}

function clearDetection(message='マーカーを探しています…'){
  lastId=null;
  hits=0;
  lastCorners=null;
  lastLabel='';
  res.textContent='---';
  stat.textContent=message;
  drawMarker(null,'');
}

function scan(){
  if(!running||busy||video.readyState<2||!detector)return;
  busy=true;
  try{
    if(!work.width||!work.height)setWorkSize();
    ctx.drawImage(video,0,0,work.width,work.height);
    const data=ctx.getImageData(0,0,work.width,work.height);
    let markers=detector.detect(data).filter(m=>Number.isInteger(m.id)&&m.id>=1&&m.id<=20);

    if(markers.length){
      markers.sort((a,b)=>polygonArea(b.corners)-polygonArea(a.corners));
      const m=markers[0];
      lastSeen=Date.now();
      lastCorners=m.corners;
      lastLabel=displayId(m.id);
      drawMarker(lastCorners,lastLabel);

      if(m.id===lastId)hits++; else{lastId=m.id;hits=1;}
      stat.textContent='候補 ID:'+displayId(m.id)+'  '+hits+'/2';
      if(hits>=2){
        res.textContent=lastLabel;
        stat.textContent='ID: '+displayId(m.id)+' 検出';
      }
    }else if(Date.now()-lastSeen>600){
      clearDetection();
    }
  }catch(e){
    stat.textContent='検出エラー: '+e.message;
  }finally{
    busy=false;
  }
}

async function start(){
  btn.disabled=true;
  stat.textContent='カメラ許可を確認中…';
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('SafariのカメラAPIを利用できません');
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}
    });
    video.srcObject=stream;
    await video.play();
    setWorkSize();
    running=true;
    btn.disabled=false;
    btn.textContent='カメラ停止';
    stat.textContent='マーカーを探しています…';
    timer=setInterval(scan,200);
  }catch(e){
    btn.disabled=false;
    btn.textContent='カメラを起動';
    stat.textContent='カメラエラー: '+(e.name||'')+' '+(e.message||e);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  }
}

function stop(){
  running=false;
  if(timer){clearInterval(timer);timer=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  lastSeen=0;
  clearDetection('停止中');
  btn.textContent='カメラを起動';
}

btn.addEventListener('click',()=>running?stop():start());
window.addEventListener('pagehide',stop);
</script>
</body>
</html>
